[project]
name = "shuffleupagus"
version = "1.1.0"
description = "generate and synchronize smart, balanced playlists"
# The floor is a language-level requirement: PEP 758's parenthesis-free `except`
# is 3.14.0. Do not raise it to a patch release — Dependabot cannot satisfy a
# patch floor and stops submitting the dependency graph. See #65.
requires-python = ">=3.14"

# PEP 440 compatible-release (`~=X.Y.Z`): patch bumps allowed, minor and major
# blocked. `>=` here was an open upper bound, which is how a ruff minor release
# walked in through Renovate's lockFileMaintenance and broke main (#38). Each
# floor is the version currently in uv.lock, so the constraint and the lockfile
# cannot disagree. Enforced by tests/test_dependency_pins.py. See #41.
dependencies = [
  "colorama                 ~= 0.4.6",
  "coloredlogs              ~=15.0.1",
  "google-api-python-client ~=2.199.0",
  "google-auth-oauthlib     ~=1.4.0",
  "pyyaml                   ~=6.0.3",

  "apple-music-python       ~= 1.0.6",
  "py-applescript           ~= 1.0.3",
  "spotipy                  ~=2.26.0",
  "ytmusicapi               ~=1.12.2",
]

[project.scripts]
shuffleupagus = "shuffleupagus.shuffleupagus:main"

# The upper bound is not optional. `uv build` warns about its absence on every
# invocation, and this is the worse instance of the unbounded-pin problem: a
# breaking uv_build release breaks the build itself rather than a runtime
# import, and it breaks the CI smoke job (#19) that builds a wheel on every PR.
# The shape is uv's own suggestion. Not `~=` because uv_build is versioned with
# uv, which moves minors freely; the range tracks the 0.12 line deliberately.
[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
# Same compatible-release convention as [project.dependencies]. It applies to
# both groups, not only to the tooling that can break a build -- a test-only
# dependency that changes behaviour under us costs the same afternoon.
dev = [
  "hypothesis~=6.165.10",
  # Parses the PEP 440 specifiers in this file for tests/test_dependency_pins.py.
  # It was already present as a transitive dependency; declared here because the
  # tests import it directly. packaging ships two-component versions, so the
  # third component is written explicitly to keep this a patch-only range.
  "packaging~=26.3.0",
  "pytest~=9.1.1",
  "pytest-cov~=7.1.0",
  "ruff~=0.16.4",
  # `~=0.0.72` is `>=0.0.72, ==0.0.*`: it admits 0.0.73 and up, and blocks 0.1.0.
  # #41 assumed a pre-1.0 compatible-release admits nothing at all and needs a
  # hand-written range. It does not -- verified against packaging.specifiers --
  # so ty takes the same form as everything else here.
  "ty~=0.0.74",
  # Exact pin, not a range: pyright ships new checks in patch releases, so an
  # unpinned gate fails the build on someone else's schedule. Renovate bumps it
  # in a commit instead. The [nodejs] extra brings Node in as a wheel, so
  # `uv sync` is still the only setup step and contributors need no Node install.
  "pyright[nodejs]==1.1.411",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",      # docstrings — not enforced project-wide
  "COM812", # trailing comma — conflicts with formatter
  "ISC001", # implicit string concat — conflicts with formatter
  "ANN",    # type annotations — gradual adoption, not enforced yet
  "T20",    # print — used intentionally for progress output
  "ERA001", # commented-out code — used for reference
  "FIX002", # TODO comments
  "TD",     # TODO formatting
  "FBT",    # boolean arg patterns — common in this codebase
  "S311",   # random — used for shuffling, not cryptography
  "TRY003", # long exception messages — acceptable for clarity
  "TRY002", # custom exception types — not necessary for a simple tool
  "EM",     # exception string/f-string literals — acceptable
  "TID252", # relative imports — intentional within package
  "A",      # shadowing builtins (`id` etc.) — pervasive pattern
  "PTH",    # pathlib vs os.path — gradual migration
  "RUF012", # mutable class attrs — existing pattern
  "LOG",    # root logger / logging patterns — existing style
  "G",      # logging format — existing style
  "PLR1722",# exit vs sys.exit — minor
  "PLR2004",# magic values — acceptable for HTTP status codes
  "PLR0913",# too many args — existing signatures
  "PLR0917",# too many positional args — positional-only variant of PLR0913
  "CPY001", # copyright notice — this repo intentionally has no file headers
  "S101",   # assert — used intentionally
  "S113",   # requests without timeout — has timeout in Data API helpers
  "BLE001", # blind except — some intentional broad catches
  "B006",   # mutable default args — existing pattern
  "C417",   # unnecessary map() — existing style
  "SLF001", # private member access — intentional for ytmusicapi internals
  "PERF402",# list append in loop — existing style
  "RET504", # assignment before return — existing style
  "PGH003", # type: ignore without code — minor
  "N806",   # camelCase variables — existing naming convention
  "C901",   # complexity — existing code
  "PLW2901",# loop variable overwrite — existing pattern
  "SIM102", # nested if — existing style
  "ARG002", # unused method argument — abstract method stubs
  "EXE002", # shebang — not relevant for a package module
  "TC001",  # type-checking imports — gradual adoption
  "TC003",  # stdlib type-checking imports — same gradual adoption as TC001
  "PLW0108",# unnecessary lambda — existing style
  "N818",   # exception naming — not using custom exceptions
  "N815",   # mixedCase class attributes — existing naming convention
  "N816",   # mixedCase module-level variables — existing naming convention
  "SIM108", # ternary operator — existing if/else style
  "PERF401",# list.extend vs append in loop — existing style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "PLC0415", # local imports inside test functions — acceptable test pattern
  "ARG005",  # unused lambda arg `self` — standard monkeypatch pattern
  "PT011",   # pytest.raises without match — match not always meaningful
  "PT006",   # parametrize first arg as string — minor style preference
]

[tool.ruff.format]
quote-style = "double"

# Both pyright and ty run. They are not redundant: ty is fast and native to the
# ruff/uv toolchain, and pyright catches diagnostics ty does not — it found all
# 13 in #40. The cost of keeping both is two suppression vocabularies, which
# today means exactly two lines carrying a ty: ignore and a pyright: ignore for
# the same deliberate type error. That is cheap and visible; revisit if it grows.
[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
# A language-level setting, not an interpreter pin: it selects which syntax and
# stdlib surface pyright checks against, and takes major.minor. .python-version
# pins the actual interpreter at 3.14.7; this only has to agree on the minor.
pythonVersion = "3.14"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "error",
  # A deprecation raised inside a dependency is not this project's failure, and
  # with warnings-as-errors an upstream release would otherwise leave the repo
  # unmergeable until someone else fixed it. Scoped to the category and the
  # module: a DeprecationWarning raised by our own code still fails the run.
  "ignore::DeprecationWarning:ytmusicapi.*",
  "ignore::DeprecationWarning:spotipy.*",
  "ignore::DeprecationWarning:applemusicpy.*",
  "ignore::DeprecationWarning:requests.*",
  "ignore::DeprecationWarning:urllib3.*",
]

[tool.coverage.report]
fail_under = 80

# Per-module floors, enforced by scripts/check_per_module_coverage.py. The
# aggregate fail_under above is a whole-project number, so one module can rot
# while another carries it. These are the ratchet: raise a floor when a module
# improves, never lower one to make a red run green.
[tool.coverage-floors]
default = 80
# main() is exercised by the CI smoke stage, which runs the installed wheel in a
# separate process and so contributes nothing to this report. Raising this floor
# needs in-process tests for main() — see #55.
"src/shuffleupagus/shuffleupagus.py" = 15
